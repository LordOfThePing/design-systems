<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm off-whites against near-black ink" name="Neutrals" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:#141414"></div><div class="meta"><div class="n">Ink</div><div class="h">#141414</div><div class="t">--ink</div></div></div>
<div class="sw"><div class="chip" style="background:#1A1A1A"></div><div class="meta"><div class="n">Ink app</div><div class="h">#1A1A1A</div><div class="t">--ink-app</div></div></div>
<div class="sw"><div class="chip" style="background:#6B6B6B"></div><div class="meta"><div class="n">Text 2</div><div class="h">#6B6B6B</div><div class="t">--text-2</div></div></div>
<div class="sw"><div class="chip" style="background:#A0A0A0"></div><div class="meta"><div class="n">Text 3</div><div class="h">#A0A0A0</div><div class="t">--text-3</div></div></div>
<div class="sw"><div class="chip" style="background:#F7F7F5"></div><div class="meta"><div class="n">Surface</div><div class="h">#F7F7F5</div><div class="t">--surface</div></div></div>
<div class="sw"><div class="chip" style="background:#F0F0EC"></div><div class="meta"><div class="n">Surface 2</div><div class="h">#F0F0EC</div><div class="t">--surface-2</div></div></div>
</div>
</body>
</html>
