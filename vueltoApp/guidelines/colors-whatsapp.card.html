<!-- @dsCard group="Colors" viewport="700x150" subtitle="Chat mockups only — never general layouts" name="WhatsApp context" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:#075E54"></div><div class="meta"><div class="n">Teal deep</div><div class="h">#075E54</div><div class="t">--wapp-teal</div></div></div>
<div class="sw"><div class="chip" style="background:#ECE5DD"></div><div class="meta"><div class="n">Chat bg</div><div class="h">#ECE5DD</div><div class="t">--wapp-bg</div></div></div>
<div class="sw"><div class="chip" style="background:#DCF8C6"></div><div class="meta"><div class="n">Bubble out</div><div class="h">#DCF8C6</div><div class="t">--wapp-out</div></div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="n">Bubble in</div><div class="h">#FFFFFF</div><div class="t">--wapp-in</div></div></div>
<div class="sw"><div class="chip" style="background:#4FC3F7"></div><div class="meta"><div class="n">Ticks</div><div class="h">#4FC3F7</div><div class="t">--wapp-tick</div></div></div>
</div>
</body>
</html>
