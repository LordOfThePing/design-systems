<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;gap:10px">
<div style="flex:1;background:var(--white);border:var(--hairline);border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;align-items:center;gap:12px">
<div style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.8px;color:var(--ink)">vuel<span style="color:var(--green)">to</span></div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--text-3)">on light</div></div>
<div style="flex:1;background:var(--ink-deep);border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;align-items:center;gap:12px">
<div style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.8px;color:var(--white)">vuel<span style="color:var(--green-light)">to</span></div>
<div style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,0.35)">on dark</div></div>
<div style="flex:1;background:var(--green);border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;align-items:center;gap:12px">
<div style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-0.8px;color:var(--white)">vuelto</div>
<div style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,0.72)">on green · derived</div></div>
</div>
</body>
</html>
