<!-- @dsCard group="Colors" viewport="700x300" subtitle="Red, amber, blue — each with a tint and a text shade" name="Semantic" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:#E24B4A"></div><div class="meta"><div class="n">Red</div><div class="h">#E24B4A</div><div class="t">--red</div></div></div>
<div class="sw"><div class="chip" style="background:#FCEBEB"></div><div class="meta"><div class="n">Red tint</div><div class="h">#FCEBEB</div><div class="t">--red-bg</div></div></div>
<div class="sw"><div class="chip" style="background:#A32D2D"></div><div class="meta"><div class="n">Red text</div><div class="h">#A32D2D</div><div class="t">--red-text</div></div></div>
<div class="sw"><div class="chip" style="background:#BA7517"></div><div class="meta"><div class="n">Amber</div><div class="h">#BA7517</div><div class="t">--amber</div></div></div>
<div class="sw"><div class="chip" style="background:#FAEEDA"></div><div class="meta"><div class="n">Amber tint</div><div class="h">#FAEEDA</div><div class="t">--amber-bg</div></div></div>
<div class="sw"><div class="chip" style="background:#EF9F27"></div><div class="meta"><div class="n">Amber fill</div><div class="h">#EF9F27</div><div class="t">--amber-fill</div></div></div>
</div>
<div class="row" style="margin-top:10px">
<div class="sw"><div class="chip" style="background:#378ADD"></div><div class="meta"><div class="n">Blue</div><div class="h">#378ADD</div><div class="t">--blue</div></div></div>
<div class="sw"><div class="chip" style="background:#E6F1FB"></div><div class="meta"><div class="n">Blue tint</div><div class="h">#E6F1FB</div><div class="t">--blue-bg</div></div></div>
<div class="sw"><div class="chip" style="background:#185FA5"></div><div class="meta"><div class="n">Blue text</div><div class="h">#185FA5</div><div class="t">--blue-text</div></div></div>
<div class="sw"><div class="chip" style="background:#F5A623"></div><div class="meta"><div class="n">Star</div><div class="h">#F5A623</div><div class="t">--star</div></div></div>
</div>
</body>
</html>
