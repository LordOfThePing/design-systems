<!-- @dsCard group="Spacing" viewport="700x140" subtitle="8 / 12 / 16 / 22 / pill" name="Radii" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:12px">
<div style="display:flex;flex-direction:column;gap:7px;align-items:center"><div style="width:48px;height:48px;background:var(--green-bg);border-radius:8px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">--radius-sm</div></div><div style="display:flex;flex-direction:column;gap:7px;align-items:center"><div style="width:48px;height:48px;background:var(--green-bg);border-radius:12px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">--radius-md</div></div><div style="display:flex;flex-direction:column;gap:7px;align-items:center"><div style="width:48px;height:48px;background:var(--green-bg);border-radius:16px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">--radius-lg</div></div><div style="display:flex;flex-direction:column;gap:7px;align-items:center"><div style="width:48px;height:48px;background:var(--green-bg);border-radius:22px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">--radius-xl</div></div><div style="display:flex;flex-direction:column;gap:7px;align-items:center"><div style="width:48px;height:48px;background:var(--green-bg);border-radius:100px"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">--radius-pill</div></div>
</div>
</body>
</html>
