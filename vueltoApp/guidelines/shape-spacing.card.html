<!-- @dsCard group="Spacing" viewport="700x130" subtitle="4 → 64, doubling loosely" name="Space scale" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:10px">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:4px;height:4px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">4</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:8px;height:8px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">8</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:12px;height:12px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">12</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:16px;height:16px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">16</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:24px;height:24px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">24</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:32px;height:32px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">32</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:48px;height:48px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">48</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--green)"></div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--text-3)">64</div></div>
</div>
</body>
</html>
