<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Hairline border, no shadow, 16px radius" name="Cards" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;gap:12px">
<div style="flex:1;background:var(--white);border:var(--hairline);border-radius:var(--radius-lg);padding:18px">
<div style="font-size:12px;color:var(--text-3)">Gastos del mes</div>
<div style="font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-1px;margin-top:5px">$248.500</div>
<div style="font-size:11.5px;color:var(--text-2);margin-top:4px">12% menos que agosto</div></div>
<div style="flex:1;background:var(--surface);border:var(--hairline);border-radius:var(--radius-lg);padding:18px">
<div style="font-size:12px;color:var(--text-3)">Sunken variant</div>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.6">--surface-sunken<br />border 0.5px @ 8%<br />shadow: none</div></div>
</div>
</body>
</html>
