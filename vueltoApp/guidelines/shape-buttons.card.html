<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Everything interactive and small is a pill" name="Buttons & pills" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
<div style="font-size:15px;font-weight:500;padding:14px 26px;border-radius:var(--radius-pill);background:var(--green);color:var(--white)">Empezar gratis</div>
<div style="font-size:14px;font-weight:500;padding:13px 22px;border-radius:var(--radius-pill);border:var(--hairline-strong);color:var(--ink)">Ver demo</div>
<div style="font-size:13.5px;font-weight:500;padding:8px 20px;border-radius:var(--radius-pill);background:var(--ink);color:var(--white)">Entrar</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px">
<div style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 14px;border-radius:var(--radius-pill);background:var(--green-bg);color:var(--green-dark)"><span style="width:6px;height:6px;border-radius:50%;background:var(--green)"></span>En vivo</div>
<div style="font-size:10.5px;font-weight:500;padding:3px 8px;border-radius:var(--radius-pill);background:var(--amber-bg);color:var(--amber)">Cerca del límite</div>
<div style="font-size:10.5px;font-weight:500;padding:3px 8px;border-radius:var(--radius-pill);background:var(--red-bg);color:var(--red-text)">Excedido</div>
<div style="font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-2)">comida</div>
</div>
</body>
</html>
