<!-- @dsCard group="Type" viewport="700x150" subtitle="Money is always Fraunces, never DM Sans" name="Figures" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;align-items:baseline;gap:28px;flex-wrap:wrap">
<div><div style="font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-1.2px">$248.500</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:3px">metric 28px / −1px</div></div>
<div><div style="font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.8px;color:var(--green-dark)">+$1.200.000</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:3px">ingreso · --green-dark</div></div>
<div><div style="font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.8px;color:var(--red)">−$46.900</div><div style="font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:3px">gasto · --red</div></div>
</div>
</body>
</html>
