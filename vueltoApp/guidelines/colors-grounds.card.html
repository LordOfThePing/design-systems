<!-- @dsCard group="Colors" viewport="700x160" subtitle="Four backgrounds; green only with white type" name="Approved grounds" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div class="row">
<div style="flex:1;height:112px;background:var(--white);border:var(--hairline);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)">#FFFFFF</span></div>
<div style="flex:1;height:112px;background:var(--surface);border:var(--hairline);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px"><span style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)">#F7F7F5</span></div>
<div style="flex:1;height:112px;background:var(--ink);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px"><span style="font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,0.5)">#141414</span></div>
<div style="flex:1;height:112px;background:var(--green);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px"><span style="font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,0.8)">#1D9E75</span></div>
</div>
</body>
</html>
