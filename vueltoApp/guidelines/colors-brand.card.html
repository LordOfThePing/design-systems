<!-- @dsCard group="Colors" viewport="700x150" subtitle="The only brand hue — one accent per layout" name="Brand green" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div class="row">
<div class="sw"><div class="chip" style="background:#1D9E75"></div><div class="meta"><div class="n">Green</div><div class="h">#1D9E75</div><div class="t">--green</div></div></div>
<div class="sw"><div class="chip" style="background:#0F6E56"></div><div class="meta"><div class="n">Green dark</div><div class="h">#0F6E56</div><div class="t">--green-dark</div></div></div>
<div class="sw"><div class="chip" style="background:#E1F5EE"></div><div class="meta"><div class="n">Green tint</div><div class="h">#E1F5EE</div><div class="t">--green-bg</div></div></div>
<div class="sw"><div class="chip" style="background:#5DCAA5"></div><div class="meta"><div class="n">Green light</div><div class="h">#5DCAA5</div><div class="t">--green-light</div></div></div>
</div>
</body>
</html>
