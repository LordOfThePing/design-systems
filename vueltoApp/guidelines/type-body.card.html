<!-- @dsCard group="Type" viewport="700x210" subtitle="400 and 500 only — no bold anywhere" name="DM Sans UI" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:9px">
<div style="font-size:19px;color:var(--text-2);line-height:1.6">Mandale un audio, una foto del ticket o un texto. Vuelto lo anota.</div>
<div style="font-size:15px;font-weight:500">15px / 500 — button label</div>
<div style="font-size:13.5px;color:var(--text-2)">13.5px / 400 — nav, body small</div>
<div style="font-size:12px;color:var(--text-3)">12px / 400 — metric label</div>
<div style="font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3)">11px / 500 / +1.5px — eyebrow</div>
</div>
</body>
</html>
