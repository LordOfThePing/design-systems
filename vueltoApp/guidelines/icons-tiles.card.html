<!-- @dsCard group="Brand" viewport="700x150" subtitle="Two tile sizes — feature 40/r10, category 32/r8" name="Icon tiles" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--white); font-family: var(--font-sans); color: var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1; min-width: 92px; border: var(--hairline); border-radius: var(--radius-md); overflow: hidden; }
  .sw .chip { height: 54px; }
  .sw .meta { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 1px; }
  .sw .n { font-size: 11.5px; font-weight: 500; }
  .sw .h { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); text-transform: uppercase; }
  .sw .t { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); }
</style>
</head>
<body>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:10px;background:var(--green-bg);border-radius:var(--radius-md);padding:11px 15px">
<div style="width:40px;height:40px;border-radius:10px;background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--green)"><img src="../assets/icons/message-square.svg" width="20" height="20" alt="" /></div>
<div style="font-size:12px;color:var(--green-dark);line-height:1.4">feature tile<br />40×40 · radius 10</div></div>
<div style="display:flex;align-items:center;gap:10px;background:var(--white);border:var(--hairline);border-radius:var(--radius-md);padding:11px 15px">
<div style="width:32px;height:32px;border-radius:var(--radius-sm);background:var(--amber-bg);display:flex;align-items:center;justify-content:center;font-size:14px">🍔</div>
<div style="font-size:12px;color:var(--text-2);line-height:1.4">category tile<br />32×32 · hue at 14%</div></div>
</div>
</body>
</html>
